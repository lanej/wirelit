name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run fixture
      - name: Generate MDX with the built Wirelit CLI
        run: node dist/cli.js generate --config examples/wirelit.json
      - name: Build Starlight and verify links
        run: npm run build --workspace examples/site && node scripts/check-links.mjs
        env:
          GITHUB_PAGES: 'true'
      # lanej/lanej.github.com owns the single Pages deployment at lanej.io.
      - uses: actions/upload-artifact@v4
        with:
          name: wirelit-documentation
          path: examples/site/dist
